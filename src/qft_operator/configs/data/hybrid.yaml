# Anomalous dimension measured from the numerically integrated AdS2 contact diagram (the
# log-derivative of the regulated bulk integral), then resummed into an RG-consistent
# power law.
#
# Under physics=ads2_cft this produces labels *identical* to data=resummed: the measured
# C_log agrees with the analytic 2 L^2 c_Delta to ~2e-7, so gamma differs by <1e-7 and
# log W by <1e-6. That is the framework validating itself, not a second kind of target --
# training on this mode will not give a different model, and a run-to-run difference
# between the two is variance, not an effect.
#
# What it buys is epistemic: the labels are *derived* from bulk quadrature rather than
# assumed from a closed form. Use it when that provenance matters, or to catch a
# regression in the quadrature. Under the reference normalization the two disagree by the
# c_Delta convention factor (see PhysicsConfig.convention_ratio), and then the difference
# is real -- and a bug.
n_train: 8192
n_val: 1024
n_test: 1024
n_phi: 64
n_pairs: 32
phi_max: 3.0
r_min: 0.05
r_max: 12.0
midpoint_range: 4.0
separation_jitter: 0.4
target_mode: hybrid
# Sine-Gordon and phi^4 anchor the analytic limits; polynomial and GP families are what
# force the network to learn the functional V -> gamma rather than memorize two curves.
family_weights:
  free: 0.10
  sine_gordon: 0.30
  phi4: 0.15
  polynomial: 0.15
  gp_fourier: 0.30
coupling_range: [0.005, 0.05]
allow_negative_coupling: true
xi_range: [0.4, 1.2]
poly_degree: 6
gp_features: 64
gp_lengthscale_range: [0.4, 1.5]
max_gamma_ratio: 0.05
normalize_shapes: true
standardize_inputs: true
batch_size: 32
num_workers: 0
seed: 0
