[project]
name = "qft-neural-operator"
version = "0.2.0"
description = "Neural operators mapping QFT actions S[phi] to boundary generating functionals W[J] in Euclidean AdS2"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Erik Löffelholz", email = "eriklfholz@googlemail.com" }]
keywords = [
    "neural-operator",
    "deeponet",
    "fourier-neural-operator",
    "quantum-field-theory",
    "ads-cft",
    "holography",
    "sine-gordon",
    "physics-informed",
    "renormalization-group",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
    "scipy>=1.11",
]

[project.optional-dependencies]
train = [
    "lightning>=2.2",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "torchmetrics>=1.3",
]
viz = [
    "matplotlib>=3.7",
    "seaborn>=0.13",
]
app = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic-settings>=2.0",
]
dev = [
    "lightning>=2.2",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "torchmetrics>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
qft-operator-train = "qft_operator.cli.train:main"
qft-operator-eval = "qft_operator.cli.evaluate:main"
qft-operator-generate = "qft_operator.cli.generate_data:main"
qft-operator-export = "qft_operator.cli.export_operator:main"

[project.urls]
Repository = "https://github.com/erik2810/qft-neural-operator"
Issues = "https://github.com/erik2810/qft-neural-operator/issues"
Mirror = "https://codeberg.org/erik/qft-neural-operator"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qft_operator = ["py.typed", "configs/*.yaml", "configs/**/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: quadrature-heavy physics validation (deselect with '-m \"not slow\"')",
    "training: requires the optional lightning/hydra stack",
]
filterwarnings = [
    "ignore::DeprecationWarning:pkg_resources.*",
    # torch.func.jvp still routes through torch.jit.script internally.
    "ignore:`torch.jit.script` is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Tests intentionally re-derive closed-form expressions inline; long math lines stay readable.
"tests/*" = ["E501"]
# Re-exports define the public surface of each subpackage.
"src/qft_operator/**/__init__.py" = ["F401"]

[tool.mypy]
# No pinned python_version: mypy follows the interpreter it runs under, so the same
# config works across the 3.10-3.13 support range without fighting versioned stubs.
packages = ["qft_operator"]
mypy_path = "src"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
ignore_missing_imports = true

