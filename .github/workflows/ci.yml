name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv venv --python ${{ matrix.python-version }} && uv pip install -e ".[dev]"
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type-check
        run: uv run mypy
      - name: Test
        run: uv run pytest -q
      - name: Smoke train
        run: uv run qft-operator-train +experiment=smoke hydra.run.dir=${{ runner.temp }}/smoke

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: |
          uv venv && uv pip install -e ".[dev]"
          npm --prefix frontend ci
      # The TypeScript tests compare against golden values generated from Python, so a
      # stale fixture must fail CI rather than be silently regenerated.
      - name: Parity fixture is current
        run: uv run pytest tests/app/test_frontend_parity.py -q
      - name: Lint and type-check
        run: npm --prefix frontend run lint && npm --prefix frontend exec tsc -b
      - name: Test
        run: npm --prefix frontend test
      - name: Build
        run: npm --prefix frontend run build

  pages:
    # Deploys the committed export; no training happens in CI.
    if: github.ref == 'refs/heads/main'
    needs: [python, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci && npm --prefix frontend run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - id: deploy
        uses: actions/deploy-pages@v4
